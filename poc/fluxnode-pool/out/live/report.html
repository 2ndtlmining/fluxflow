    ${check(m.integrity.missing.length === 0, 'Every height fetched', `${fmt(m.blocks)} / ${fmt(m.to - m.from + 1)} blocks, ${m.integrity.missing.length} missing`)}
    ${check(m.integrity.brokenLinks.length === 0, 'Hash chain unbroken', `previousblockhash of every block matches the hash of the block before it (${m.integrity.brokenLinks.length} breaks)`)}
    ${check(m.integrity.anchorVotes.agree > 0 && m.integrity.anchorVotes.disagree === 0, 'Top block confirmed by independent nodes', `${m.integrity.anchorVotes.agree} agree, ${m.integrity.anchorVotes.disagree} disagree`)}
    ${check(true, 'Cross-node spot checks', `each node's first 3 blocks, then ~1 in 20 at random, re-read from a different node (hash, tx count, output total); ${m.evictions.filter(e => e.reason.startsWith('mismatch')).length} node(s) caught returning different data and evicted, their blocks re-fetched`, 'info')}
    ${check(true, 'Fault tolerance', `${fmt(m.errors)} failed requests retried on other nodes (${Object.entries(m.errorKinds).map(([k, n]) => `${k}: ${n}`).join(', ') || 'none'}); ${m.evictions.length} node(s) evicted`, 'info')}
    ${check(true, 'Node height spread', Object.entries(p.heightSpread).sort((a,b)=>parseInt(a[0])-parseInt(b[0])).map(([k, n]) => `${k}: ${n}`).join(' · '), 'info')}
  </div>
</div>`);

$(`<div class="grid two" style="margin-top:14px">
  <div class="panel"><h2>Does the data match what FluxFlow needs?</h2>
    ${check(v.transfersWithFullInputs === v.transfers, 'Input address + amount on every transfer', `${fmt(v.transfersWithFullInputs)} / ${fmt(v.transfers)} transfers (${fmt(v.inputsTotal)} inputs, ${fmt(v.inputsMissingAddressOrValue)} missing). No per-tx follow-up calls needed.`)}
    ${check(v.outputsWithAddress >= v.outputsTotal * 0.99, 'Output address + amount', `${fmt(v.outputsWithAddress)} / ${fmt(v.outputsTotal)} outputs have a transparent address`)}
    ${check(v.conservationFailures.length === 0 && v.conservationChecked > 0, 'Amounts & units correct', `inputs − outputs = a small positive fee for ${fmt(v.conservationChecked - v.conservationFailures.length)} / ${fmt(v.conservationChecked)} transfers (total fees ${fmt(v.feeSatTotal / 1e8, 4)} FLUX); valueSat used, not value/1e8`)}
    ${check(true, 'Tx types identified', Object.entries(v.txKinds).map(([k, n]) => `${k}: ${fmt(n)}`).join(' · ') + ' — fluxnode start/confirm txs have no vin/vout and are skipped', 'info')}
    ${check(true, 'Block type', Object.entries(v.blockTypes).map(([k, n]) => `${k}: ${fmt(n)}`).join(' · '), 'info')}
    ${check(v.coinbaseOutputsToKnownNodeOperators > 0, 'Node rewards visible in coinbase', `${fmt(pct(v.coinbaseValueToNodeOperatorsSat, v.coinbaseValueSat), 1)}% of coinbase value paid to addresses in the current node list (${fmt(v.coinbaseRecipients)} distinct recipients) → historical node-operator detection from our own data`)}
  </div>
  <div class="panel"><h2>Run through FluxFlow's own processTransaction()</h2>
    <table>
      <tr><th>Flow type</th><th class="r">Events</th><th class="r">FLUX</th></tr>
      ${['selling', 'buying', 'p2p'].map(t => `<tr><td>${t}</td><td class="r">${fmt(v.flowByType[t] || 0)}</td><td class="r">${fmt(v.flowAmountByType[t] || 0, 2)}</td></tr>`).join('')}
    </table>
    <div class="sub" style="margin:10px 0 0">${fmt(v.relevantTxs)} relevant txs (touching an exchange, Foundation or node-operator address) out of ${fmt(v.transfers)} transfers. Exchanges hit: ${Object.entries(v.exchangeHits).map(([k, n]) => `${k} (${n})`).join(', ') || 'none in this range'}.</div>
  </div>
</div>`);

$(`<div class="panel" style="margin-top:14px"><h2>Sample buy/sell events produced by the unchanged app code</h2><div class="scroll">
  <table><tr><th>Block</th><th>Tx</th><th>Type</th><th>From</th><th>To</th><th>Exchange</th><th class="r">FLUX</th></tr>
  ${v.sampleEvents.map(e => `<tr><td>#${fmt(e.height)}</td><td class="mono">${short(e.txid)}</td><td><span class="pill ${e.flowType}">${e.flowType}</span></td>
    <td class="mono">${short(e.from)} <span class="sub">${e.fromType}</span></td><td class="mono">${short(e.to)} <span class="sub">${e.toType}</span></td>
    <td>${e.exchange || ''}</td><td class="r">${fmt(e.amount, 2)}</td></tr>`).join('') || '<tr><td colspan="7" class="sub">No exchange flows in this block range</td></tr>'}
  </table></div></div>`);

$(`<div class="panel" style="margin-top:14px"><h2>Run log</h2><pre>${R.log.map(l => l.replace(/</g, '&lt;')).join('\n')}</pre></div>`);

function kpi(l, val, n) { return `<div class="panel kpi"><div class="l">${l}</div><div class="v">${val}</div><div class="n">${n}</div></div>`; }
function check(ok, t, d, kind) {
  const k = kind || (ok ? 'pass' : 'fail');
  return `<div class="check"><div class="dot ${k}">${k === 'pass' ? '✓' : k === 'fail' ? '✕' : 'i'}</div><div><div class="t">${t}</div><div class="d">${d}</div></div></div>`;
}

function scalingChart() {
  const pts = [{ nodes: 1, blocksPerSec: R.baseline.blocksPerSec, base: true }, ...R.scaling, { nodes: m.nodes, blocksPerSec: m.blocksPerSec, main: true }];
  const W = 520, H = 240, L = 44, B = 28, T = 10, Rr = 10;
  const maxY = Math.max(...pts.map(p => p.blocksPerSec)) * 1.15;
  const bw = (W - L - Rr) / pts.length;
  const y = (v) => H - B - (v / maxY) * (H - B - T);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Throughput by node count">`;
  for (let i = 0; i <= 4; i++) { const val = maxY * i / 4; s += `<line x1="${L}" x2="${W - Rr}" y1="${y(val)}" y2="${y(val)}" stroke="#243047"/><text x="${L - 6}" y="${y(val) + 4}" text-anchor="end">${fmt(val, val < 10 ? 1 : 0)}</text>`; }
  pts.forEach((p, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64;
    const col = p.base ? '#8b97ad' : p.main ? '#22c55e' : '#38bdf8';
    s += `<rect x="${x}" y="${y(p.blocksPerSec)}" width="${w}" height="${H - B - y(p.blocksPerSec)}" rx="3" fill="${col}"/>`;
    s += `<text x="${x + w / 2}" y="${y(p.blocksPerSec) - 5}" text-anchor="middle" style="fill:#e6ebf5">${fmt(p.blocksPerSec, p.blocksPerSec < 10 ? 1 : 0)}</text>`;
    s += `<text x="${x + w / 2}" y="${H - 10}" text-anchor="middle">${p.base ? '1 (seq)' : p.main ? p.nodes + ' (main)' : p.nodes}</text>`;
  });
  return s + `</svg><div class="sub" style="margin:6px 0 0">Blocks per second (y) by number of nodes used (x). Grey: one node, one request at a time.</div>`;
}

function timelineChart() {
  const tl = m.timeline; if (!tl.length) return '';
  const W = 520, H = 240, L = 44, B = 28, T = 10, Rr = 10;
  const maxT = tl[tl.length - 1][0] || 1, maxN = tl.length;
  const x = (t) => L + (t / maxT) * (W - L - Rr), y = (n) => H - B - (n / maxN) * (H - B - T);
  let d = `M${x(0)},${y(0)}`; tl.forEach((e, i) => { d += `L${x(e[0])},${y(i + 1)}`; });
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Blocks fetched over time">`;
  for (let i = 0; i <= 4; i++) { const n = maxN * i / 4; s += `<line x1="${L}" x2="${W - Rr}" y1="${y(n)}" y2="${y(n)}" stroke="#243047"/><text x="${L - 6}" y="${y(n) + 4}" text-anchor="end">${fmt(n)}</text>`; }
  for (let i = 0; i <= 4; i++) { const t = maxT * i / 4; s += `<text x="${x(t)}" y="${H - 10}" text-anchor="middle">${fmt(t / 1000, 1)}s</text>`; }
  m.evictions.forEach(ev => { s += `<line x1="${x(ev.t)}" x2="${x(ev.t)}" y1="${T}" y2="${H - B}" stroke="#f59e0b" stroke-dasharray="3 3"/>`; });
  s += `<path d="${d}" fill="none" stroke="#38bdf8" stroke-width="2"/>`;
  return s + `</svg><div class="sub" style="margin:6px 0 0">Cumulative blocks fetched over time. Dashed lines: a node was evicted and its work re-queued.</div>`;
}

function nodeBars() {
  const rows = m.nodeStats.slice(0, 40);
  const max = Math.max(...rows.map(r => r.served), 1);
  const W = 520, rowH = 11, H = rows.length * rowH + 8, L = 150;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Blocks served per node">`;
  rows.forEach((r, i) => {
    const w = (r.served / max) * (W - L - 50);
    const col = r.evicted ? '#ef4444' : '#38bdf8';
    s += `<text x="${L - 6}" y="${i * rowH + 9}" text-anchor="end" style="font-size:9px">${host(r.baseUrl)}</text>`;
    s += `<rect x="${L}" y="${i * rowH + 2}" width="${Math.max(w, 1)}" height="${rowH - 3}" rx="2" fill="${col}"/>`;
    s += `<text x="${L + w + 4}" y="${i * rowH + 9}" style="font-size:9px">${r.served}${r.evicted ? ' evicted' : ''} · ${r.avgMs ? fmt(r.avgMs) + 'ms' : ''}</text>`;
  });
  return s + `</svg>`;
}
</script>
</body>
