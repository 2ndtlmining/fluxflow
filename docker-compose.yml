# FluxFlow — production stack. One container, one port, one persistent volume.
#
#   First launch:  cp .env.example.compose .env   # then set ADMIN_TOKEN
#                  deploy/redeploy.sh
#   Update:        deploy/redeploy.sh             # pull, back up, rebuild, verify
#   Logs:          docker compose logs -f
#
# See "Running with Docker Compose" in README.md.

# A fixed project name keeps the volume name stable. Without it Compose prefixes volumes
# with the checkout's directory name, so cloning into a different folder would start on an
# empty database while the real one sat orphaned under the old name.
name: fluxflow

services:
  fluxflow:
    build:
      context: .
      target: runtime
      args:
        # Set by deploy/redeploy.sh; /api/health reports it.
        GIT_SHA: ${GIT_SHA:-dev}
    image: fluxflow:${GIT_SHA:-dev}
    container_name: fluxflow
    restart: unless-stopped

    # Only one port needs publishing (#9).
    ports:
      - '${PORT:-3000}:3000'

    # Everything else (data sources, sync tuning, logging) comes from .env, so an update
    # never overwrites local settings. Values below are the ones the image layout depends on.
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/flux-flow.db
      LABELS_PATH: /app/config/labels.json
      LOG_PRETTY: '0'
      # Required: admin endpoints are rejected without it, and production refuses to boot.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env}

    volumes:
      # The SQLite database (and pre-deploy backups under backups/). This is the only state;
      # it survives rebuilds, `down`, and image updates. Only `down -v` deletes it.
      - fluxflow-data:/app/data
      # Labels can be edited without rebuilding the image.
      - ./config:/app/config:ro

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

    # Ingestion commits in batches; give it time to finish the in-flight transaction
    # instead of being SIGKILLed mid-write (#14).
    stop_grace_period: 30s

    # better-sqlite3 needs more than the default 64 MB of locked memory for large
    # transactions.
    ulimits:
      memlock:
        soft: -1
        hard: -1

volumes:
  fluxflow-data:
    # Explicit, so the data volume is the same no matter where the repo is checked out.
    name: fluxflow-data
